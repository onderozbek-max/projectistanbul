<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <title>B / authored vector: comic panel, Arda and Kaan on the bridge</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A6FA8"/><stop offset="0.5" stop-color="#E8A36B"/><stop offset="1" stop-color="#FFD9A0"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7BA9B8"/><stop offset="1" stop-color="#2F5F7E"/>
    </linearGradient>
    <filter id="wobble" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="6" result="t"/>
      <feColorMatrix in="t" type="matrix" values="0 0 0 0 0.08  0 0 0 0 0.08  0 0 0 0 0.12  0 0 0 0.9 -0.38"/>
    </filter>
    <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <circle cx="3.5" cy="3.5" r="1.3" fill="#14151F" opacity="0.28"/>
    </pattern>
    <clipPath id="frame"><rect x="12" y="64" width="366" height="704"/></clipPath>
  </defs>

  <rect width="390" height="844" fill="#F4EBDD"/>
  <g clip-path="url(#frame)">
    <g filter="url(#wobble)">
      <rect x="12" y="64" width="366" height="704" fill="url(#sky)"/>
      <circle cx="300" cy="330" r="72" fill="#FFF0C2" opacity="0.7"/>
      <circle cx="300" cy="330" r="38" fill="#FFF8DC"/>
      <!-- skyline: mosque silhouette stays in the background -->
      <g stroke="#14151F" stroke-width="3" stroke-linejoin="round" fill="#3C3F66" opacity="0.92">
        <path d="M12 430V396H44V372H70V396H96V430Z"/>
        <path d="M120 430V392C120 360 176 360 176 392V430Z"/>
        <path d="M148 360V318L152 310L156 318V360" />
        <path d="M200 430V340H212V430Z"/><path d="M200 340L206 318L212 340Z"/>
        <path d="M230 430V380H270V430Z"/><path d="M288 430V366H312V430Z"/><path d="M324 430V388H378V430Z"/>
      </g>
      <rect x="12" y="430" width="366" height="150" fill="url(#sea)"/>
      <g stroke="#FFFFFF" stroke-width="3" opacity="0.5" stroke-linecap="round"><path d="M40 470H90M150 490H220M260 462H330M80 520H150M220 540H300"/></g>
      <path d="M300 430V580" stroke="#FFE9A8" stroke-width="22" opacity="0.28"/>
      <!-- bridge rail -->
      <g stroke="#14151F" stroke-width="4" stroke-linejoin="round">
        <rect x="12" y="560" width="366" height="20" fill="#6F7580"/>
        <path d="M12 560H378" stroke-width="5"/>
        <path d="M40 560V470M110 560V470M180 560V470M250 560V470M320 560V470M380 560V470" stroke-width="3.5"/>
        <path d="M12 470H378" stroke-width="4.5"/>
      </g>
      <rect x="12" y="580" width="366" height="188" fill="#7D7F8C"/>
      <rect x="12" y="580" width="366" height="188" fill="url(#dots)"/>
      <path d="M12 580H378" stroke="#14151F" stroke-width="5"/>
      <!-- fishing lines -->
      <g stroke="#14151F" stroke-width="1.6" fill="none" opacity="0.8"><path d="M60 470L50 600M150 470L162 600M240 470L236 600"/></g>
    </g>

    <!-- Kaan: broad, blond crop, striped tee, red checked towel -->
    <g stroke="#14151F" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M170 768C166 650 190 600 252 592C314 600 340 650 336 768Z" fill="#F4EBDD"/>
      <path d="M176 700H332M174 672H334M176 644H330M180 616H326" stroke="#2A3F73" stroke-width="13" stroke-linecap="butt" fill="none"/>
      <path d="M170 768C166 650 190 600 252 592C314 600 340 650 336 768Z" fill="none"/>
      <path d="M192 618L236 604L248 650L216 690Z" fill="#D7263D"/>
      <path d="M204 626L232 616M210 644L238 634M218 664L240 654" stroke="#8E1523" stroke-width="2.4"/>
      <path d="M232 604H274V584H232Z" fill="#E7B58E" stroke-width="3.5"/>
      <ellipse cx="252" cy="520" rx="62" ry="70" fill="#F0C29B"/>
      <path d="M190 516C186 462 222 442 252 444C284 442 318 462 314 516C300 488 272 476 252 478C232 476 204 488 190 516Z" fill="#E8C96A"/>
      <path d="M200 482L212 470M220 468L228 456M242 462L248 450M266 462L272 450M286 470L292 458" stroke="#B89A3C" stroke-width="3"/>
      <ellipse cx="190" cy="528" rx="9" ry="14" fill="#E7B58E"/><ellipse cx="314" cy="528" rx="9" ry="14" fill="#E7B58E"/>
    </g>
    <g stroke="#14151F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M216 506Q228 500 240 506"/><path d="M268 506Q280 500 292 506"/>
    </g>
    <circle cx="228" cy="520" r="8" fill="#FFFFFF" stroke="#14151F" stroke-width="2.4"/><circle cx="280" cy="520" r="8" fill="#FFFFFF" stroke="#14151F" stroke-width="2.4"/>
    <circle cx="230" cy="521" r="4.6" fill="#3C86C9"/><circle cx="282" cy="521" r="4.6" fill="#3C86C9"/>
    <circle cx="231" cy="520" r="1.8" fill="#14151F"/><circle cx="283" cy="520" r="1.8" fill="#14151F"/>
    <path d="M238 556Q254 568 272 556" fill="#FFFFFF" stroke="#14151F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M254 534V546" stroke="#14151F" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M178 500C178 500 196 476 204 480" fill="none" stroke="#FFF" stroke-width="0"/>
    <!-- Kaan shade side -->
    <path d="M296 600C330 624 338 690 336 768H300C306 700 300 640 296 600Z" fill="#3C3F66" opacity="0.28"/>

    <!-- Arda: round warm face, quiff, red hoodie, one earbud -->
    <g stroke="#14151F" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M22 768C20 668 46 636 96 628C148 636 170 668 168 768Z" fill="#D7263D"/>
      <path d="M62 628C70 652 86 660 96 660C108 660 122 652 130 628" fill="#A31C2F"/>
      <path d="M80 660V700M112 660V700" stroke="#F4EBDD" stroke-width="3.5"/>
      <path d="M44 720H148V768H44Z" fill="#B21E33" stroke-width="3"/>
      <path d="M78 628H116V606H78Z" fill="#C98F65" stroke-width="3.5"/>
      <ellipse cx="96" cy="552" rx="54" ry="60" fill="#D9A178"/>
      <path d="M44 546C38 494 66 470 98 470C128 470 152 494 148 546C138 520 118 510 96 510C74 510 54 520 44 546Z" fill="#3A2417"/>
      <path d="M88 470C84 448 100 436 114 446C120 454 112 462 108 470Z" fill="#3A2417"/>
      <ellipse cx="46" cy="560" rx="8" ry="13" fill="#C98F65"/><ellipse cx="148" cy="560" rx="8" ry="13" fill="#C98F65"/>
      <circle cx="44" cy="566" r="5.5" fill="#F4EBDD" stroke-width="2.6"/>
      <path d="M44 572Q36 600 54 622" fill="none" stroke="#F4EBDD" stroke-width="2.6"/>
    </g>
    <circle cx="74" cy="556" r="12" fill="#FFFFFF" stroke="#14151F" stroke-width="2.6"/><circle cx="118" cy="556" r="12" fill="#FFFFFF" stroke="#14151F" stroke-width="2.6"/>
    <circle cx="77" cy="558" r="8" fill="#5A3417"/><circle cx="121" cy="558" r="8" fill="#5A3417"/>
    <circle cx="79" cy="555" r="3" fill="#FFFFFF"/><circle cx="123" cy="555" r="3" fill="#FFFFFF"/>
    <g stroke="#14151F" stroke-width="3.6" stroke-linecap="round" fill="none">
      <path d="M60 532Q74 524 88 532"/><path d="M106 532Q120 524 134 532"/>
      <path d="M82 592Q96 600 112 590"/>
      <path d="M96 566V576"/>
    </g>
    <path d="M24 700C24 668 48 640 96 632C84 660 74 700 76 768H24Z" fill="#FF6B7D" opacity="0.32"/>
    <path d="M142 636C162 660 168 700 168 768H140C144 704 146 664 142 636Z" fill="#3C3F66" opacity="0.28"/>
  </g>
  <rect x="12" y="64" width="366" height="704" fill="none" stroke="#14151F" stroke-width="6"/>
  <rect x="12" y="64" width="366" height="704" filter="url(#grain)" opacity="0.5"/>
</svg>
