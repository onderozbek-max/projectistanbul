<!doctype html>
<meta charset="utf-8">
<title>Weapon tier stills (owner feedback: weapons look alike)</title>
<!-- Stills of each weapon at level 1, 3, 5 and its evolution, on a mid-grey ground, with Arda and a few walkers.
     The page loads the game's own scripts from index.html (except js/main.js and the meta UI screens), so the stills use the
     real sim and the real renderer. The street, props, HUD and bubbles are stubbed out; the weapon, hero and enemies are real.
     Driven by tools/weapon-tier-still.js over headless Chrome (CDP):
       window.__still.ready                  true once the scripts are loaded
       window.__still.render(id, lv, evo)    one still; returns a PNG data URL (evo = true for an evolution, lv = its mastery rank)
       window.__still.sheet(rows)            rows of [id, lv, evo] drawn as one contact sheet; returns a PNG data URL
     Visual randomness uses a seeded PRNG so the stills are repeatable. -->
<style>html,body{margin:0;background:#14151F}#game{width:390px;height:844px;display:block}</style>
<canvas id="game" width="390" height="844"></canvas>
<script>window.P = {}; window.__still = { ready: false, errs: [], loaded: [] };
window.addEventListener('error', function (e) { window.__still.errs.push(String(e.message) + ' @' + String(e.filename).split('/').pop() + ':' + e.lineno); });</script>
<script>
(function () {
  var SKIP = /^js\/main\.js$|^js\/meta\/meta-(ui|map|gear|stats|tree|bond-ui|arsenal)\.js$/;
  var SEED = 20260613, DPR = 2, DELAY_STEPS = 6, DT = 1 / 60;
  function prng(seed) {   // mulberry32: the visuals' Math.random, fixed per still
    return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  // Scripts in index.html order (the same list the game loads), one after another so the order holds.
  fetch('../index.html').then(function (r) { return r.text(); }).then(function (html) {
    var files = Array.from(html.matchAll(/<script src="([^"]+)"/g)).map(function (m) { return m[1]; })
      .filter(function (f) { return !SKIP.test(f); });
    var i = 0;
    (function next() {
      if (i >= files.length) return boot();
      var s = document.createElement('script');
      s.src = '../' + files[i++]; s.onload = function () { window.__still.loaded.push(s.src); next(); };
      s.onerror = function () { window.__still.error = 'missing ' + s.src; next(); };
      document.head.appendChild(s);
    })();
  });

  function stubWorld() {   // the street, props, HUD text and bubbles are not part of a weapon still
    var noop = function () {};
    P.RenderWorld.drawGround = function (R) {   // mid-grey ground (stone_grey token) in world metres
      R.ctx.fillStyle = '#8A8F98'; R.ctx.fillRect(R.X(-12), R.Y(R.cam.y + 16), 24 * R.ppm, 32 * R.ppm);
    };
    ['drawRestaurant', 'drawShadows', 'drawTram', 'drawProps', 'drawLights', 'drawScaffold'].forEach(function (k) { P.RenderWorld[k] = noop; });
    P.Decor.drawStreet = noop; P.Decor.drawOverhead = noop;
    ['LayoutFx', 'EnvFx', 'EnemiesFx2', 'EventsFx', 'Vehicles', 'Barks'].forEach(function (k) { P[k] = null; });
    P.RenderOverlay.worldText = noop; P.RenderOverlay.screen = noop; P.Speech.resolve = noop;
  }

  var canvas, R0;
  function boot() {
    P.Settings = P.Settings || {};
    stubWorld();
    canvas = document.getElementById('game');
    P.Render.init(canvas); P.Render.resize(DPR);
    window.__still.ready = true;
  }

  // One still: a fresh sim with Arda alone (the weapon under test), five walkers ahead, the shot's frame after DELAY_STEPS.
  function still(id, lv, evo) {
    Math.random = prng(SEED + (evo ? 1000 : 0) + lv * 7 + id.length);
    var base = evo ? P.CFG.evolutions[id].from : id, rank = evo ? lv : 0;
    var s = P.createSim(SEED % 1000, { levelIndex: 11, loadout: { mastery: (function () { var m = {}; m[base] = rank; return m; })() } });
    s.mode = 'play';
    if (!s.sk) P.Skills.init(s);
    var h = s.hero;
    h.hp = h.maxHp = 1e9; h.passives = {};
    P.Progression.debugGrant(s, { weapons: evo ? (function () { var g = {}; g[id] = 1; return g; })() : (function () { var g = {}; g[id] = lv; return g; })(), passives: {} });
    Object.keys(h.weapons).forEach(function (k) { if (k !== id) delete h.weapons[k]; });
    h.cds = {}; h.x = 0; h.y = 30; h.fx = 0; h.fy = 1;
    s.enemies = [];
    for (var k = 0; k < 5; k++) {
      var a = Math.PI / 2 + (k - 2) * 0.42, r = 1.7 + (k % 3) * 0.6;
      var e = P.Combat.spawnEnemy(s, 'walker', h.x + Math.cos(a) * r, h.y + Math.sin(a) * r, { state: 'active' });
      e.hp = 1e6; e.still = true;
    }
    P.Fx.reset(s); P.FireAnim.reset(s);
    var steps = 0, fired = -1, out = null;
    P.Fx.cam.zoom = 1; P.Fx.cam.w = P.CFG.view.widthM;
    for (steps = 0; steps < 1500 && out === null; steps++) {
      P.stepSim(s, DT, { x: 0, y: 0 });
      s.enemies = s.enemies.filter(function (e) { return e.still || e.dead; });
      var evs = P.drainEvents(s);
      evs.forEach(function (ev) {
        P.Fx.onEvent(ev, s); P.FireAnim.onEvent(ev, s);
        if (fired < 0 && ev.type === 'wfire' && ev.variant === id) fired = steps;
      });
      P.Fx.update(s, DT); P.FireAnim.update(DT, s);
      if (fired >= 0 && steps >= fired + DELAY_STEPS) out = steps;
    }
    if (fired < 0) throw new Error('no wfire for ' + id + ' L' + lv + (evo ? ' (evo)' : ''));
    var P0 = P.Fx.cam; P0.x = h.x; P0.y = h.y; P0.ox = 0; P0.oy = 0; P0.rot = 0; P0.trauma = 0; P0.punchT = 0;
    P.Render.frame(s, null);
    return { png: canvas.toDataURL('image/png'), fired: fired, steps: out };
  }

  // Contact sheet: rows is a list of rows; a row is a list of cells [id, lv, evo] drawn left to right at half size.
  function sheet(rows) {
    var w = 390, h = 844, sc = 0.5, cw = w * sc, ch = h * sc, cols = 0, out = document.createElement('canvas');
    rows.forEach(function (row) { cols = Math.max(cols, row.length); });
    out.width = cols * cw * DPR; out.height = rows.length * ch * DPR;
    var ctx = out.getContext('2d');
    rows.forEach(function (row, r) {
      row.forEach(function (cell, c) {
        still(cell[0], cell[1], !!cell[2]);   // leaves the frame on the game canvas
        ctx.drawImage(canvas, c * cw * DPR, r * ch * DPR, cw * DPR, ch * DPR);
      });
    });
    return out.toDataURL('image/png');
  }

  window.__still.render = function (id, lv, evo) {
    try { var r = still(id, lv, !!evo); return { png: r.png, fired: r.fired, steps: r.steps }; }
    catch (e) { return { error: String(e && e.stack || e).split('\n').slice(0, 3).join(' | ') }; }
  };
  window.__still.sheet = function (rows) {
    try { return { png: sheet(rows) }; } catch (e) { return { error: String(e && e.stack || e).split('\n').slice(0, 3).join(' | ') }; }
  };
})();
</script>
