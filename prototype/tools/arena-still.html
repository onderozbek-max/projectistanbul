<script>
(function () {
  var q = new URLSearchParams(location.search);
  var hood = parseInt(q.get('hood') || '0', 10), stage = parseInt(q.get('stage') || '1', 10), Y = parseFloat(q.get('y') || '40');
  var showBlocks = q.get('blocks') !== '0', DPR = parseInt(q.get('dpr') || '2', 10);
  var BLOCKS = [
    { kind: 'car', x: -1.3, y: 36, w: 1.8, h: 4.2 }, { kind: 'taxi', x: 1.2, y: 52, w: 1.8, h: 4.3 },
    { kind: 'dolmus', x: -1.2, y: 70, w: 1.9, h: 4.6 }, { kind: 'bus', x: 1.4, y: 98, w: 2.5, h: 9 },
    { kind: 'barrier', x: 0, y: 128, w: 2.4, h: 0.6 }, { kind: 'kiosk', x: -2.2, y: 150, w: 1.4, h: 1.1 },
    { kind: 'bench', x: 2.1, y: 168, w: 1.6, h: 0.5 }, { kind: 'bin', x: -2.4, y: 182, w: 0.5, h: 0.5 },
    { kind: 'planter', x: 2.4, y: 192, w: 1.2, h: 1.2 }, { kind: 'crates', x: -2.6, y: 202, w: 1.2, h: 1.0 },
    { kind: 'tables', x: 2.8, y: 212, w: 1.6, h: 1.2 }, { kind: 'cart', x: -1.0, y: 222, w: 1.2, h: 0.8 },
    { kind: 'tree', x: 0.6, y: 118, w: 1.0, h: 1.0 }, { kind: 'bollard', x: -0.8, y: 86, w: 0.4, h: 0.4 },
    { kind: 'mystery', x: 1.8, y: 60, w: 1, h: 1 }
  ];
  if (q.get('kit')) {   // R1-T3: the hood's street kit (journey.js) laid out in two columns, both variants of each kind; &extra=a,b adds kinds
    var kitKinds = P.Journey.hoods[hood].kit.concat((q.get('extra') || '').split(',').filter(Boolean)), n = 0;
    BLOCKS = [];
    kitKinds.forEach(function (kd) {
      var sz = P.CFG.levels.kinds[kd] || [1, 1];
      [0, 0.99].forEach(function (v) { var bx = n % 2 ? 2.2 : -2.2, by = Y - 9 + Math.floor(n / 2) * 3.4; BLOCKS.push({ kind: kd, x: bx, y: by, w: sz[0], h: sz[1], v: v, rc: { xMin: bx - sz[0] / 2, xMax: bx + sz[0] / 2, yMin: by - sz[1] / 2, yMax: by + sz[1] / 2 } }); n++; });
    });
    showBlocks = true;
  }
  var ui = { exit: { checked: false }, blocks: { checked: showBlocks } };
  function fakeSim(level) {
    var li = P.Journey.level(level), theme = li.hood.theme;
    return {
      seed: 1, t: 0, runT: 0, mode: 'play', levelIndex: level, levelInfo: li, theme: theme,
      // geo.sub: stage number (1..5) exercises the sub-location path; the L1 path ignores geo.
      geo: { xMin: -4.6, xMax: 4.6, length: 230, exitY: 230, holdY: 200, holdT: 56, boss: null, exitOpen: ui.exit.checked,
        blocks: ui.blocks.checked ? BLOCKS : [], sub: li.stage },
      hero: { x: 0, y: 0, fx: 0, fy: 1, hp: 100, maxHp: 100, moving: false, invuln: 0, pickupRadius: 1.2, sinceHit: 99,
        weapons: { knife: 1 }, passives: {}, cds: {}, chainA: 0, swingDir: 1, regenOn: false, hitFlash: 0 },
      enemies: [], drops: [], projs: [], nails: [], zones: [], events: [], enemyTele: [], enemyShots: [], hacks: [], ev: { list: [], helpers: [] },
      props: { carts: [], canisters: [], doorOpen: false, shutter: 0, shutterOpen: false, scaffoldDown: false },
      dir: { civilians: [], telegraphs: [], flags: {}, bubbles: [], barks: { cur: null, queue: [] }, tut: { active: null }, hold: { active: false }, zoomOut: false }
    };
  }

  var canvas = document.getElementById('game'), level = hood * 5 + stage, sim = fakeSim(level), cam;
  P.Render.init(canvas); P.Render.resize(DPR);
  P.Fx.reset(sim); cam = P.Fx.cam;
  sim.hero.x = 0; sim.hero.y = Y;
  if (q.get('evo') === '0') P.CFG.arenaEvolve.on = false;   // baseline: the arena before the evolution pass
  if (q.get('live')) {   // a real run: the sim walks the hero up the street for &secs seconds so enemies, weapons and props are on screen
    sim = P.createSim(parseInt(q.get('seed') || '5', 10), { levelIndex: level, loadout: null });
    sim.mode = 'play'; sim.hero.hp = sim.hero.maxHp = 1e9;
    P.Fx.reset(sim); cam = P.Fx.cam;
    // &prog=0..1 puts the hero at that share of the route (teleported) and lets the horde and the kills build up with no input.
    var prog = q.get('prog'), input = prog !== null ? { x: 0, y: 0 } : { x: 0, y: 1 };
    if (prog !== null) sim.hero.y = Math.max(2, parseFloat(prog) * (sim.geo ? sim.geo.exitY : 230));
    for (var i = 0; i < parseFloat(q.get('secs') || '25') * 60; i++) { P.stepSim(sim, 1 / 60, input); sim.events.length = 0; }
    Y = sim.hero.y;
  }
  if (q.get('station') && sim.eczane) {   // R1-T4 part 17: with &live=1, the hero 3 m below the level's first heal station (the real
    var st0 = sim.eczane.list[0];         // genProps path, so the state comes from P.Eczane.state); &empty=1 marks it used
    if (q.get('empty')) st0.used = true;
    sim.hero.y = Y = st0.b.y - 3;
  }
  if (q.get('noart')) P.ArenaArt.tile = function () { return null; };   // baseline: the baked canvas tiles
  if (q.get('noprops')) P.ArenaProps.draw = function () { return false; };   // baseline: the procedural props
  if (q.get('noover')) P.ArenaOverhead.draw = function () { return false; };   // baseline: the procedural overhead rigs
  if (q.get('nosky')) P.ArenaSky.draw = function () {};   // baseline: no skyline layer
  function shoot() {   // &settle=1 renders 14 frames 80 ms apart, so eased effects (the overhead fade under the hero) reach their end state
    var k = 0, n = q.get('settle') ? 14 : 3;
    (function step() {
      cam.y = Y; cam.x = 0; cam.w = P.CFG.view.widthM; cam.ox = 0; cam.oy = 0; cam.rot = 0; cam.zoom = 1; cam.trauma = 0; cam.punchT = 0;
      P.Render.frame(sim, null);
      if (++k < n) return q.get('settle') ? setTimeout(step, 80) : step();
      if (q.get('dump')) { var o = document.createElement('pre'); o.id = 'out'; o.textContent = 'PNG:' + canvas.toDataURL('image/png'); document.body.appendChild(o); }
    })();
  }
  function bench() {   // ?bench=1: render cost per frame (ms) over a live walk; prints BENCH:{median,p95,p99,max,over16,n}
    var t = [], n = parseInt(q.get('frames') || '240', 10), i, o, s0;
    for (i = 0; i < 30; i++) { P.stepSim(sim, 1 / 60, { x: 0, y: 1 }); sim.events.length = 0; cam.y = sim.hero.y; P.Render.frame(sim, null); }
    for (i = 0; i < n; i++) {
      P.stepSim(sim, 1 / 60, { x: 0, y: 1 }); sim.events.length = 0; cam.y = sim.hero.y; cam.x = 0; cam.w = P.CFG.view.widthM;
      s0 = performance.now(); P.Render.frame(sim, null); t.push(performance.now() - s0);
    }
    t.sort(function (a, b) { return a - b; });
    o = document.createElement('pre'); o.id = 'out';
    o.textContent = 'BENCH:' + JSON.stringify({ median: +t[Math.floor(n * 0.5)].toFixed(2), p95: +t[Math.floor(n * 0.95)].toFixed(2), p99: +t[Math.floor(n * 0.99)].toFixed(2), max: +t[n - 1].toFixed(1), over16: t.filter(function (x) { return x > 16.7; }).length, n: n });
    document.body.appendChild(o);
  }
  var tries = 0;
  (function wait() { if (!(P.ArenaArt.ready() && P.ArenaProps.ready() && P.ArenaOverhead.ready() && P.ArenaSky.ready()) && tries++ < 100) return setTimeout(wait, 50); setTimeout(q.get('bench') ? bench : shoot, 100); })();
})();
</script>
