<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fire animation preview (workstream B)</title>
<style>
  body { margin: 0; padding: 16px; background: #5C616E; font: 600 13px/1.3 system-ui, -apple-system, sans-serif; color: #F4EBDD; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 12px; }
  select, button { font: inherit; padding: 4px 6px; }
  label { display: inline-flex; gap: 6px; align-items: center; }
  .grid { display: grid; grid-template-columns: repeat(6, 210px); gap: 10px 10px; }
  .cell { margin: 0; }
  .cell canvas { display: block; width: 210px; height: 180px; border-radius: 6px; background: #8A8F98; }
  .cell figcaption { margin-top: 3px; font-weight: 600; font-size: 12px; }
  .row { display: flex; gap: 24px; align-items: flex-start; margin-top: 18px; }
  #phone canvas { display: block; width: 390px; height: 844px; border-radius: 12px; background: #8A8F98; }
  #info { margin-top: 6px; font-weight: 500; }
</style>
</head>
<body>
<div class="bar">
  <label>Speed <select id="speed"><option value="1">1x</option><option value="0.5">0.5x</option><option value="0.25" selected>0.25x (slow-mo)</option></select></label>
  <label><input id="rm" type="checkbox"> reduce motion (half density)</label>
  <label><input id="crowd" type="checkbox" checked> crowd of 90</label>
  <label>Phone shows <select id="pick"></select></label>
  <label>Aim <select id="aim"><option value="0">east</option><option value="0.8">north-east</option><option value="2.4">west-north</option></select></label>
  <button id="pause">pause</button>
</div>
<div class="grid" id="grid"></div>
<div class="row">
  <div id="phone"><canvas id="phoneCanvas" width="390" height="844"></canvas></div>
  <div>
    <h3 style="margin: 0 0 8px;">Phone scale (390 x 844 CSS px at 1x), 90 crowd silhouettes</h3>
    <div id="info"></div>
  </div>
</div>

<script>window.P = {};</script>
<script src="../js/config.js"></script>
<script src="../js/config-weapons.js"></script>
<script src="../js/view/settings.js"></script>
<script src="../js/view/art-rig.js"></script>
<script src="../js/view/art-characters.js"></script>
<script src="../js/view/art-enemies.js"></script>
<script src="../js/view/sprites.js"></script>
<script src="../js/view/art-bosses.js"></script>
<script src="../js/view/fire-anim-prim.js"></script>
<script src="../js/view/fire-anim-held.js"></script>
<script src="../js/view/fire-anim-held2.js"></script>
<script src="../js/view/fire-anim-fx.js"></script>
<script src="../js/view/fire-anim-fx2.js"></script>
<script src="../js/view/fire-anim.js"></script>

<script>
(function () {
  var IDS = ['knife', 'nailgun', 'canister', 'chain', 'sledge', 'molotov', 'fireworks', 'cable', 'speargun', 'extinguisher',
    'sawblade', 'manhole', 'torch', 'olta', 'cardoor', 'slingshot', 'chainsaw'];
  var NAMES = { knife: 'Döner Bıçağı', nailgun: 'Çivi Tabancası', canister: 'Piknik Tüpü', chain: 'Bisiklet Zinciri', sledge: 'Varyoz',
    molotov: 'Ateş Şişesi', fireworks: 'Havai Fişek', cable: 'Canlı Kablo', speargun: 'Zıpkın', extinguisher: 'Yangın Tüpü',
    sawblade: 'Testere Diski', manhole: 'Rögar Kapağı', torch: 'Pürmüz', olta: 'Olta', cardoor: 'Araba Kapısı', slingshot: 'Sapan',
    chainsaw: 'Motorlu Testere' };
  var PERIOD = 1.1, DT_MAX = 0.05, speed = 0.25, paused = false, last = 0;
  var pick = document.getElementById('pick'), aimSel = document.getElementById('aim'), crowdBox = document.getElementById('crowd');
  var HERO = { skin: '#E0AC80', shirt: '#D7263D', pants: '#2B3346', hair: '#1E1712' };
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var phoneEl = document.getElementById('phoneCanvas');
  var pickAll = document.createElement('option'); pickAll.value = 'all'; pickAll.textContent = 'all, in turn'; pick.appendChild(pickAll);
  IDS.forEach(function (id) { var o = document.createElement('option'); o.value = id; o.textContent = NAMES[id]; pick.appendChild(o); });
  pick.value = 'all';

  // Crowd: 90 dark silhouettes around the hero, fixed seed so the view is repeatable.
  var seed = 7; function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  var CROWD = []; for (var i = 0; i < 90; i++) CROWD.push({ x: (rnd() - 0.5) * 9, y: rnd() * 9 - 1.2 });

  function mkSim() { return { hero: { x: 0, y: 0, fx: 1, fy: 0, moving: false, revving: 0, revAng: 0, weapons: {} }, projs: [], events: [] }; }

  // One figure: its own FireAnim instance, sim and clock. ppm = px per metre; ang = aim (world radians).
  function Figure(canvas, cssW, cssH, ppm, id) {
    this.canvas = canvas; this.ctx = canvas.getContext('2d'); this.w = cssW; this.h = cssH; this.ppm = ppm; this.id = id;
    this.F = P.FireAnim.create(); this.sim = mkSim(); this.t = 0; this.fired = -1;
    canvas.width = Math.round(cssW * DPR); canvas.height = Math.round(cssH * DPR);
  }
  Figure.prototype.R = function () {
    var self = this, s = this.sim;
    return { ctx: this.ctx, W: this.w, H: this.h, ppm: this.ppm,
      X: function (x) { return self.w / 2 + (x - s.hero.x) * self.ppm; },
      Y: function (y) { return self.h * 0.66 - (y - s.hero.y) * self.ppm; } };
  };
  Figure.prototype.step = function (dt) {
    var F = this.F, s = this.sim;
    this.t += dt;
    var cyc = Math.floor(this.t / PERIOD);
    if (cyc !== this.fired) {
      this.fired = cyc;
      F.onEvent({ type: 'wfire', w: this.id, x: 0, y: 0, ang: parseFloat(aimSel.value), lv: 5, n: this.id === 'slingshot' ? 3 : 1 }, s);
      if (this.id === 'chainsaw') { s.hero.revving = 0.3; s.hero.revAng = parseFloat(aimSel.value); }
    }
    if (s.hero.revving > 0) s.hero.revving = Math.max(0, s.hero.revving - dt);
    F.update(dt, s);
  };
  Figure.prototype.draw = function (phase) {
    var c = this.ctx, R = this.R(), s = this.sim, F = this.F, ppm = this.ppm, h = s.hero;
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    var g = c.createLinearGradient(0, 0, 0, this.h); g.addColorStop(0, '#9AA0A9'); g.addColorStop(1, '#7F858F');
    c.fillStyle = g; c.fillRect(0, 0, this.w, this.h);
    if (crowdBox.checked && this.crowd !== false) {
      CROWD.forEach(function (q) {
        var X = R.X(q.x), Y = R.Y(q.y);
        c.beginPath(); c.ellipse(X, Y, 0.3 * ppm, 0.16 * ppm, 0, 0, Math.PI * 2); c.fillStyle = '#2B2D36'; c.fill();
        c.strokeStyle = '#14151F'; c.lineWidth = 1.5; c.stroke();
      });
    }
    // Ground ring under Arda (player_ring), as in render.js.
    c.beginPath(); c.ellipse(R.X(h.x), R.Y(h.y - 0.25), 0.5 * ppm, 0.2 * ppm, 0, 0, Math.PI * 2); c.strokeStyle = '#3DDCFF'; c.lineWidth = 3; c.stroke();
    var so = { u: ppm * 1.22, back: false, face: 1, phase: 0, skin: HERO.skin, shirt: HERO.shirt, pants: HERO.pants, hair: HERO.hair,
      arms: 'idle', still: true, flash: 0 };
    F.heroOpts(s, so);
    P.Sprites.hero(c, R.X(h.x), R.Y(h.y - 0.25), so);
    c.globalAlpha = 1;
    F.drawHeld(R, s);
    F.drawFx(R, s);
  };

  // Grid: one figure per weapon, larger scale for form checks.
  var grid = document.getElementById('grid'), figs = [];
  IDS.forEach(function (id) {
    var fig = document.createElement('figure'); fig.className = 'cell';
    var cv = document.createElement('canvas'); fig.appendChild(cv);
    var cap = document.createElement('figcaption'); cap.textContent = id + ' · ' + NAMES[id]; fig.appendChild(cap);
    grid.appendChild(fig);
    var f1 = new Figure(cv, 210, 180, 60, id); f1.crowd = false; figs.push(f1);
  });

  // Phone: one figure at phone scale (1x CSS px per 39 px/m, ppm from the view width of 10 m), optional cycle through all.
  var phone = new Figure(phoneEl, 390, 844, 39, 'knife');
  phone.crowd = true;
  var phoneIdx = 0, phoneT = 0;
  function phoneStep(dt) {
    var pv = pick.value;
    if (pv === 'all') {
      phoneT += dt; if (phoneT >= 2.2) { phoneT = 0; phoneIdx = (phoneIdx + 1) % IDS.length; phone.id = IDS[phoneIdx]; phone.sim = mkSim(); phone.F = P.FireAnim.create(); phone.fired = -1; phone.t = 0; }
    } else if (phone.id !== pv) { phone.id = pv; phone.sim = mkSim(); phone.F = P.FireAnim.create(); phone.fired = -1; phone.t = 0; }
    phone.step(dt);
  }

  function frame(ts) {
    var dt = Math.min(DT_MAX, (ts - (last || ts)) / 1000); last = ts;
    var sdt = paused ? 0 : dt * speed;
    P.Settings.reduceMotion = document.getElementById('rm').checked;
    figs.forEach(function (f) { f.step(sdt); f.draw(); });
    phoneStep(sdt); phone.draw();
    document.getElementById('info').textContent = (pick.value === 'all' ? NAMES[phone.id] + ' (cycling)' : NAMES[phone.id]) +
      ' · speed ' + speed + 'x · reduce motion ' + (P.Settings.reduceMotion ? 'on' : 'off') + ' · live particles ' +
      phone.F.pool.filter(function (p) { return p.alive; }).length;
    requestAnimationFrame(frame);
  }

  document.getElementById('speed').addEventListener('change', function (e) { speed = parseFloat(e.target.value); });
  document.getElementById('pause').addEventListener('click', function () { paused = !paused; this.textContent = paused ? 'play' : 'pause'; });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
