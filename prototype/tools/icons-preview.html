<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icon preview</title>
<style>
  body { margin: 0; padding: 24px; background: #8A8F98; font: 600 13px/1.3 system-ui, -apple-system, sans-serif; color: #14151F; }
  h1 { margin: 0 0 16px; font-size: 16px; color: #F4EBDD; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
  .item { background: #C9CED6; border-radius: 12px; padding: 10px; }
  .name { margin: 0 0 8px; font-size: 13px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .card { border-radius: 10px; padding: 10px; display: flex; align-items: center; justify-content: center; gap: 14px; min-height: 116px; }
  .card.light { background: #FFFFFF; }
  .card.dark { background: #14151F; }
  .card svg { display: block; }
</style>
</head>
<body>
<h1>Icon preview: 96px and 32px on white and dark cards</h1>
<div id="grid" class="grid"></div>

<script>window.P = {};</script>
<script src="../js/view/icons.js"></script>
<script>
  (function () {
    var grid = document.getElementById('grid');
    var html = '';
    P.Icons.ids.forEach(function (id) {
      var cell = function (cls) {
        return '<div class="card ' + cls + '">' + P.Icons.svg(id, 96) + P.Icons.svg(id, 32) + '</div>';
      };
      html += '<section class="item"><p class="name">' + id + '</p><div class="pair">' +
        cell('light') + cell('dark') + '</div></section>';
    });
    grid.innerHTML = html;
  })();
</script>
</body>
</html>
