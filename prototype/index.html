<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<title>Project Istanbul · Level 1 prototype</title>
<link rel="stylesheet" href="css/motion.css">
<link rel="stylesheet" href="css/proto.css">
<link rel="stylesheet" href="css/meta.css">
<link rel="stylesheet" href="css/comic.css">

<body>
<main id="stage">
  <div id="phone" role="application" aria-label="Level 1 prototype">
    <canvas id="game" aria-hidden="true"></canvas>

    <!-- In-run HUD (design/lofi/04-run-hud.html, DS 5, 13; AUDIT-7 U1). Two rows and an XP line, about 18% of 844 pt:
         row 1 = HP, journey level (BÖLÜM n/100 over the hood, two lines), timer, pause; XP line = Adrenalin (the in-run level,
         a bolt and a number), Street Cred, XP, streak; row 2 = objective (the boss bar replaces it
         in a boss fight) or the call strip (icon + one line). At 150% text, settings.js (P.applySettings) moves Street Cred
         into row 2 so the streak chip keeps the XP bar at least 120 px wide (T4 part 8). -->
    <div class="mode-vignette" id="mode-vignette" aria-hidden="true"></div>
    <header id="hud" class="hud hidden">
      <div class="hud-row top">
        <div class="hp">
          <div class="hp-bar"><div class="hp-trail" id="hp-trail"></div><div class="hp-fill" id="hp-fill"></div><div class="hp-ticks"></div><span class="hp-text" id="hp-text">100 / 100</span></div>
        </div>
        <span class="chip lvl-chip" id="lvl-chip"><span class="jl-num" id="jl-num"></span><span class="jl-hood" id="jl-hood"></span><i class="hud-moon hidden" id="hud-moon" role="img"></i></span>
        <span class="chip" id="timer">0:00</span>
        <button class="btn-icon" id="btn-pause" data-i18n-aria="ui.hud.pause"><span class="pause-glyph"></span></button>
      </div>
      <div class="hud-xp">
        <span class="chip adr-chip" id="lv" role="img" aria-label="Adrenalin 1"><svg class="adr-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M13.5 1.5 4 13.5h6.2l-1.6 9 10.4-12.9h-6.3z"/></svg><span id="lv-num">1</span></span>
        <span class="sk-meter" id="sk-meter"><svg class="sk-ico" viewBox="0 0 24 24" aria-hidden="true"><polygon fill="#FFD166" stroke="#14151F" stroke-width="2" points="12,1.5 15,9 23,9 16.5,14 19,22.5 12,17.5 5,22.5 7.5,14 1,9 9,9"/></svg><span class="sk-label" id="sk-label"></span><span class="sk-track"><i id="sk-fill"></i></span></span>
        <div class="xp-bar"><div class="xp-fill" id="xp-fill"></div></div>
        <div class="streak hidden" id="streak"><span id="streak-label"></span><span class="streak-bar"><i id="streak-fill"></i></span></div>
      </div>
      <div class="hud-sub">
        <div class="obj-slot" id="obj-slot"></div>
        <div class="boss-bar hidden" id="boss-bar" aria-hidden="true"><span class="boss-name" id="boss-name"></span><span class="boss-track"><i id="boss-fill"></i></span></div>
        <span class="call hidden" id="call"><svg class="call-ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg><span id="call-label">Anne</span> <span id="call-time">00:00</span>
          <span class="bars" id="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span></span>
      </div>
    </header>
    <div id="subs" class="subs hidden" aria-live="polite"><b id="subs-speaker"></b><span id="subs-text"></span></div>
    <div id="prompt" class="prompt hidden"><span id="prompt-text"></span></div>
    <div id="toast" class="toast hidden"></div>
    <!-- Level-up banner (T4 part 5): non-blocking, 1.2 s, no taps. Text from ui-progress.js. -->
    <div id="lvl-banner" class="lvl-banner hidden" role="status" aria-live="polite"><b id="lvl-title"></b><span id="lvl-line"></span></div>
    <div id="joy" class="joy hidden" aria-hidden="true"><div class="knob"></div></div>
    <div id="skills" class="skills hidden">
      <div class="dash-chip" id="dash-chip" aria-hidden="true"><span class="dash-fill" id="dash-fill"></span><b data-i18n="ui.hud.dash"></b><small class="dash-sec" id="dash-sec"></small></div>
      <button class="btn-ult" id="btn-ult" data-i18n-aria="ui.hud.ult"><span class="ult-fill" id="ult-fill"></span><span class="ult-eye"><i></i></span></button>
    </div>

    <!-- 01 Title -->
    <section id="scr-title" class="screen dark">
      <div class="row between">
        <div class="lang" role="group" aria-label="Language">
          <button class="link" data-lang="tr">TR</button> | <button class="link" data-lang="en">EN</button>
        </div>
        <button class="btn-icon" id="btn-title-settings" data-i18n-aria="ui.title.settings"></button>
      </div>
      <div class="keyart" aria-hidden="true"><canvas id="keyart"></canvas></div>
      <div class="logo">
        <div class="signal" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <h1 class="display" lang="en" data-i18n="ui.title.logo"></h1>
        <div class="title-sub" data-i18n="ui.title.sub"></div>
      </div>
      <button class="btn primary wide" id="btn-start" data-i18n="ui.title.tap"></button>
      <p class="caption center light" data-i18n="ui.title.proto"></p>
    </section>

    <!-- Cold open (LD 4) -->
    <section id="scr-cold" class="cold hidden">
      <div class="lb top"></div><div class="lb bottom"></div>
      <div class="cold-subs" id="cold-subs"><b id="cold-speaker"></b><span id="cold-text"></span></div>
      <div class="comic hidden" id="comic"></div>
      <div class="lettering hidden" id="lettering">ŞAK!</div>
      <button class="skip" id="btn-skip"><span class="skip-fill"></span><span data-i18n="ui.skip"></span></button>
    </section>

    <!-- 05 Level up -->
    <section id="scr-cards" class="screen overlay hidden">
      <div class="center-stack">
        <h2 class="display light" id="cards-title"></h2>
        <p class="caption light" id="cards-sub"></p>
        <p class="tut-pill hidden" id="cards-tut" data-i18n="prompt.t_card"></p>
        <div class="cards" id="cards"></div>
        <div class="row gap">
          <button class="btn secondary grow" id="btn-reroll"></button>
          <button class="btn secondary grow" id="btn-reroll-ad" disabled></button>
        </div>
        <div class="panel build" id="cards-build"></div>
      </div>
      <!-- Card detail (AUDIT-7 U2): opened by a long press on a card; the full text, every stat row and the recipe. -->
      <div class="card-info hidden" id="card-info" role="dialog" aria-modal="true">
        <div class="panel card-info-panel">
          <p class="caption" id="ci-type"></p>
          <h3 class="h1" id="ci-name"></h3>
          <p class="ci-desc" id="ci-desc"></p>
          <div class="stats" id="ci-stats"></div>
          <p class="ci-chip" id="ci-chip"></p>
          <button class="btn primary wide" id="btn-ci-close" data-i18n="ui.cards.close"></button>
        </div>
      </div>
    </section>

    <!-- Mini Chest (CC 8) -->
    <section id="scr-chest" class="screen overlay chest hidden">
      <h2 class="display light" data-i18n="chest.title"></h2>
      <canvas id="chest-canvas" aria-hidden="true"></canvas>
      <div class="chest-info" id="chest-info">
        <div class="icon" id="chest-icon"></div>
        <div class="name" id="chest-name"></div>
        <div class="chest-level" id="chest-level"></div>
        <div class="stats" id="chest-stats"></div>
        <p class="caption light" data-i18n="chest.tap"></p>
      </div>
    </section>

    <!-- 07 Pause -->
    <section id="scr-pause" class="screen overlay hidden">
      <div class="center-stack">
        <div class="panel">
          <div class="row between"><h2 class="h1" data-i18n="ui.pause.title"></h2><span class="caption" id="pause-level"></span></div>
          <button class="btn primary wide" id="btn-resume" data-i18n="ui.pause.resume"></button>
          <button class="btn secondary wide" id="btn-pause-settings" data-i18n="ui.pause.settings"></button>
          <button class="btn secondary wide" id="btn-restart" data-i18n="ui.pause.restart"></button>
          <button class="btn ghost wide" id="btn-quit" data-i18n="ui.pause.quit"></button>
          <p class="caption" id="pause-quit-note"></p>
        </div>
        <div class="panel">
          <p class="caption" data-i18n="ui.pause.build"></p>
          <div class="slots" id="pause-build"></div>
          <button class="btn ghost wide small-btn hidden" id="btn-export" data-i18n="ui.pause.export"></button>
        </div>
      </div>
    </section>

    <!-- 16 Settings (subset) -->
    <section id="scr-settings" class="screen light-bg hidden">
      <div class="row between"><button class="btn ghost square" id="btn-settings-back" data-i18n-aria="ui.set.back">←</button>
        <h2 class="h1" data-i18n="ui.set.title"></h2><span class="square"></span></div>
      <button class="btn ghost wide small-btn hidden" id="btn-settings-export" data-i18n="ui.pause.export"></button>
      <div class="list" id="settings-list"></div>
      <p class="caption light" id="settings-note"></p>
    </section>

    <!-- 09 Down / revive -->
    <section id="scr-down" class="screen overlay hidden">
      <div class="center-stack">
        <h2 class="display light" data-i18n="ui.down.title"></h2>
        <p class="caption light" id="down-survived"></p>
        <p class="body light down-line" id="down-line"></p>
        <div class="panel row gap">
          <div class="icon-box" id="down-icon"></div>
          <div><p class="caption" data-i18n="ui.down.cause"></p><p class="title" id="down-cause"></p><p class="body" id="down-tip"></p></div>
        </div>
        <div class="panel" id="down-revive">
          <p class="title" data-i18n="ui.down.keepGoing"></p>
          <button class="btn primary wide" id="btn-revive-ad"></button>
          <button class="btn secondary wide" id="btn-revive-gold"></button>
          <p class="caption" id="down-note"></p>
        </div>
        <button class="btn ghost light wide" id="btn-giveup"></button>
      </div>
    </section>

    <!-- Exit title slam (LD 7) -->
    <section id="scr-slam" class="screen slam hidden">
      <div class="signal" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <h1 class="display" lang="en" data-i18n="ui.title.logo"></h1>
      <div class="title-sub" data-i18n="ui.title.sub"></div>
      <p class="slam-sub" data-i18n="ui.slam.sub"></p>
    </section>

    <!-- 08 Results -->
    <section id="scr-results" class="screen light-bg hidden">
      <!-- Head, rewards and recap scroll in .res-body (at 150% text, and with the objective panel); the actions are a footer
           under it, so they never cover text. -->
      <div class="res-body">
        <div class="center-block">
          <p class="caption" id="res-label"></p>
          <h2 class="display" id="res-title"></h2>
          <div class="stars" id="res-stars"></div>
          <p class="caption" id="res-criteria"></p>
          <p class="pw-strip" id="res-power"></p>
        </div>
        <div class="panel" id="res-rewards"></div>
        <div class="panel res-recap" id="res-recap"></div>
        <!-- Anchor only, never shown: objectives-hud.js inserts its results panel right after this element. The time and walk
             rows are in the recap now (ui-progress.js). -->
        <div id="res-run" class="hidden"></div>
      </div>
      <div class="res-actions">
        <button class="btn secondary wide" id="btn-double" disabled></button>
        <button class="btn primary wide" id="btn-next" data-i18n="ui.res.next"></button>
        <div class="row gap">
          <button class="btn secondary grow" id="btn-retry" data-i18n="ui.res.retry"></button>
          <button class="btn ghost light grow" id="btn-to-title" data-i18n="ui.res.title"></button>
        </div>
      </div>
    </section>
  </div>
</main>
